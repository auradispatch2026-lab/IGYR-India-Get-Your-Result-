<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Institutes</title>
    <link rel="stylesheet" href="css/style.css?v=2">
    <link rel="stylesheet" href="css/dashboard.css?v=2">

    
    <style>
        :root {
            --admin-bg: #f3f8ff;
            --admin-card: rgba(255, 255, 255, 0.9);
            --admin-primary: #1266d6;
            --admin-dark: #062b63;
        }
        body { background: var(--admin-bg); font-family: 'Inter', sans-serif; }
        .dashboard { min-height: 100vh; display: flex; }
        
        .sidebar { background: linear-gradient(180deg, var(--admin-dark) 0%, #0a3d8c 100%); box-shadow: 4px 0 20px rgba(0,0,0,0.1); border-right: 1px solid rgba(255,255,255,0.1); }
        .sidebar h2 { font-family: 'Poppins', sans-serif; font-size: 22px; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.15); text-transform: uppercase; letter-spacing: 1px; color: #fce38a; }
        .sidebar ul li a { font-size: 15px; padding: 12px 20px; margin-bottom: 8px; border-radius: 8px; transition: 0.3s; font-weight: 500; display: flex; align-items: center; gap: 10px; }
        .sidebar ul li a:hover { background: rgba(255,255,255,0.1); transform: translateX(5px); }
        
        .main-content { padding: 40px; }
        .main-content h1 { font-family: 'Poppins', sans-serif; font-size: 32px; color: var(--admin-dark); margin-bottom: 30px; display: flex; align-items: center; gap: 15px; }
        .main-content h1::before { content: '⚡'; font-size: 28px; }
        
        .card { 
            background: var(--admin-card); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 10px 30px rgba(7, 29, 73, 0.05); 
            border-radius: 16px; 
            padding: 25px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(7, 29, 73, 0.08); }
        
        input, select, textarea { 
            background: #f8fbff; 
            border: 1px solid #cde0f5; 
            transition: 0.3s; 
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        input:focus, select:focus, textarea:focus { border-color: var(--admin-primary); outline: none; box-shadow: 0 0 0 3px rgba(18,102,214,0.1); background: #fff; }
        
        .btn-primary { background: linear-gradient(135deg, var(--admin-primary) 0%, #0a3d8c 100%); border: none; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; border-radius: 8px; box-shadow: 0 4px 15px rgba(18,102,214,0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(18,102,214,0.4); }
        
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(6, 43, 99, 0.6); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: #fff; padding: 40px; border-radius: 20px; max-width: 550px; width: 90%;
            text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.5);
            animation: modalPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes modalPop { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }
    </style>

</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <h2>Super Admin</h2>
            <ul>
                <li><a href="admin-dashboard.html">Dashboard</a></li>
                <li><a href="admin-institutes.html">Manage Institutes</a></li>
                <li><a href="admin-login-institute.html">Login Institute</a></li>
                <li><a href="index.html">Logout</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <h1>Manage Institutes</h1>
            <div class="card" style="margin-bottom: 20px; text-align: left; padding: 20px; background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-radius: 8px;">
                <h2>Add New Institute</h2>
                <form id="admin-add-inst-form" style="display: flex; gap: 15px; flex-wrap: wrap; align-items: center; margin-top: 15px;">
                    <input type="text" id="add-inst-id" placeholder="Custom Institute ID (e.g. IGYR-001)" required style="width: 250px; padding: 10px; font-weight: bold;">
                    <input type="text" id="add-inst-name" placeholder="Institute Name" required style="width: 220px; padding: 10px;">
                    <input type="text" id="add-inst-type" placeholder="Type (e.g. School)" required style="width: 150px; padding: 10px;">
                    <select id="add-inst-state" required style="width: 180px; padding: 10px;"><option value="">Select State</option></select>
                    <select id="add-inst-district" required style="width: 180px; padding: 10px;"><option value="">Select District</option></select>
                    <input type="text" id="add-inst-address" placeholder="Full Address" required style="width: 300px; padding: 10px;">
                    <input type="file" id="add-inst-logo" accept="image/*" style="width: 220px; padding: 10px;" title="Upload Institute Logo">
                    <input type="file" id="add-inst-sign" accept="image/*" style="width: 220px; padding: 10px;" title="Upload Signature (Optional)">
                    <button type="submit" class="btn btn-primary" style="padding: 10px 25px;">Add Institute</button>
                </form>
            </div>
            <table class="table" style="background:#fff;">
                <thead><tr><th>ID</th><th>Name</th><th>Action</th></tr></thead>
                <tbody id="admin-inst-body"></tbody>
            </table>
        </main>
    </div>
    <script src="js/data-india.js?v=1000010"></script>
    <script src="js/storage.js?v=1000010v=2"></script>
    <script src="js/admin.js?v=1000010"></script>

    <!-- Edit Institute Modal -->
    <div id="edit-inst-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="max-width: 600px; text-align: left;">
            <h2 style="color: #062b63; margin-bottom: 20px;">✏️ Edit Institute</h2>
            <form id="edit-inst-form" style="display: flex; flex-direction: column; gap: 15px;">
                <input type="hidden" id="edit-original-id">
                <div>
                    <label>Institute ID</label>
                    <input type="text" id="edit-inst-id" required style="width: 100%; padding: 10px;">
                </div>
                <div>
                    <label>Institute Name</label>
                    <input type="text" id="edit-inst-name" required style="width: 100%; padding: 10px;">
                </div>
                <div>
                    <label>Type (e.g., School, College)</label>
                    <input type="text" id="edit-inst-type" required style="width: 100%; padding: 10px;">
                </div>
                <div style="display: flex; gap: 15px;">
                    <div style="flex: 1;">
                        <label>State</label>
                        <select id="edit-inst-state" required style="width: 100%; padding: 10px;"><option value="">Select State</option></select>
                    </div>
                    <div style="flex: 1;">
                        <label>District</label>
                        <select id="edit-inst-district" required style="width: 100%; padding: 10px;"><option value="">Select District</option></select>
                    </div>
                </div>
                <div>
                    <label>Full Address</label>
                    <input type="text" id="edit-inst-address" required style="width: 100%; padding: 10px;">
                </div>
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Save Changes</button>
                    <button type="button" class="btn btn-outline" style="flex: 1;" onclick="closeEditModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>





<script>
// SUPER FOOLPROOF GLOBAL FUNCTION
window.openEditModal = function(id) {
    try {
        console.log("Opening modal for:", id);
        let rawData = localStorage.getItem('igyr_institutes');
        let insts = rawData ? JSON.parse(rawData) : [];
        let inst = null;
        for(let i=0; i<insts.length; i++) {
            if(insts[i].id === id) {
                inst = insts[i]; break;
            }
        }
        
        if (!inst) {
            alert('Institute not found!');
            return;
        }
        
        document.getElementById('edit-original-id').value = inst.id || '';
        document.getElementById('edit-inst-id').value = inst.id || '';
        document.getElementById('edit-inst-name').value = inst.name || '';
        document.getElementById('edit-inst-type').value = inst.type || '';
        document.getElementById('edit-inst-address').value = inst.address || '';
        
        let stateSel = document.getElementById('edit-inst-state');
        let distSel = document.getElementById('edit-inst-district');
        
        if(stateSel && distSel) {
            stateSel.innerHTML = '<option value="">Select State</option>';
            distSel.innerHTML = '<option value="">Select District</option>';
            
            if (typeof INDIA_STATES !== 'undefined') {
                for (let st in INDIA_STATES) {
                    let opt = document.createElement('option');
                    opt.value = st; opt.textContent = st;
                    if(st === inst.state) opt.selected = true;
                    stateSel.appendChild(opt);
                }
                
                if (inst.state && INDIA_STATES[inst.state]) {
                    let dts = INDIA_STATES[inst.state];
                    for(let i=0; i<dts.length; i++) {
                        let dt = dts[i];
                        let opt = document.createElement('option');
                        opt.value = dt; opt.textContent = dt;
                        if(dt === inst.district) opt.selected = true;
                        distSel.appendChild(opt);
                    }
                }
                
                stateSel.onchange = function() {
                    distSel.innerHTML = '<option value="">Select District</option>';
                    if (INDIA_STATES[this.value]) {
                        let dd = INDIA_STATES[this.value];
                        for(let j=0; j<dd.length; j++) {
                            let opt = document.createElement('option');
                            opt.value = dd[j]; opt.textContent = dd[j];
                            distSel.appendChild(opt);
                        }
                    }
                };
            }
        }
        
        let modal = document.getElementById('edit-inst-modal');
        if(modal) {
            modal.style.display = 'flex';
        } else {
            alert("Modal element missing from HTML!");
        }
    } catch(err) {
        alert("CRITICAL ERROR: " + err.message);
    }
};

window.closeEditModal = function() {
    let modal = document.getElementById('edit-inst-modal');
    if(modal) modal.style.display = 'none';
};
</script>

</body>
</html>
