<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#071d49">

    <title>All Tabulation</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">

    <style>
        @media print {
            body { background: white; margin: 0; padding: 0; }
            .sidebar { display: none !important; }
            .main-content { margin-left: 0 !important; width: 100% !important; padding: 0 !important; }
            .no-print { display: none !important; }
            .card { box-shadow: none !important; padding: 0 !important; border: none !important; margin: 0 !important; }
            h1 { display: none !important; }
            h3 { text-align: center; margin-bottom: 20px !important; }
            table { width: 100%; border-collapse: collapse; }
            th, td { border: 1px solid #000 !important; padding: 8px !important; font-size: 12px; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            
            /* Print landscape if possible */
            @page { size: landscape; }
        }
    </style>
</head>

<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="sidebar-header" style="text-align: center; padding: 20px 10px 15px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px;">
                <img src="igyr-logo.jpg" alt="IGYR" class="blinking-logo" style="height: 60px; object-fit: contain; margin-bottom: 12px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));">
                <h2 id="sidebar-inst-name" style="font-size: 1.15rem; color: #fce38a; margin: 0; line-height: 1.4; font-weight: 700; word-wrap: break-word;">Loading...</h2>
            </div>
            <ul>
                <li><a href="institute-dashboard.html">Dashboard</a></li>
                <li><a href="institute-upload-result.html">Upload Result</a></li>
                <li><a href="institute-tabulation.html">All Tabulation</a></li>
                <li><a href="institute-drafts.html">Manage Drafts</a></li>
                <li><a href="institute-settings.html">⚙️ Settings</a></li>
                <li><a href="index.html">Logout</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <h1>All Tabulation Sheets</h1>
            <div class="card" style="margin-top:20px; background:#fff; padding: 25px;">
                <h3 style="color:var(--primary); margin-bottom:15px;">Select Exam to View Tabulation</h3>
                <div style="display:flex; gap:15px; margin-bottom:20px;">
                    <select id="tab-exam-select" style="flex:1; padding:10px; border:1px solid #ccc; border-radius:5px;">
                        <option value="">-- Select Exam --</option>
                    </select>
                    <button id="btn-view-tab" class="btn btn-primary no-print">View Tabulation</button>
                    <button id="btn-print-tab" class="btn no-print" style="background:#28a745; color:white; display:none;" onclick="window.print()">🖨️ Print Tabulation</button>
                </div>
                
                <div id="tabulation-container" style="margin-top:20px; overflow-x:auto;">
                    <!-- Tabulation table will be rendered here -->
                </div>
            </div>
        </main>
    </div>
    <script src="js/storage.js?v=1000034"></script>
    <script src="js/tabulation.js?v=1000034"></script>
</body>
</html>
